<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>Automated Vertrek Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .app { max-width: 800px; width: 100%; padding: 24px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    .subtitle { margin-top: 0; color: #9ca3af; }
    .card {
      background: #111827;
      border-radius: 12px;
      padding: 20px;
      margin-top: 16px;
      border: 1px solid #1f2937;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #9ca3af;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input[type="text"], input[type="time"], input[type="date"], select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.92rem;
    }
    input:focus, select:focus { outline: 2px solid #3b82f6; border-color: #3b82f6; }
    .hint { font-size: 0.75rem; color: #4b5563; margin-top: 4px; }
    .toggle-group {
      display: flex;
      gap: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #374151;
      margin-top: 4px;
      width: fit-content;
    }
    .toggle-group input[type="radio"] { display: none; }
    .toggle-group label {
      padding: 7px 18px;
      background: #020617;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      margin: 0;
      text-transform: none;
      letter-spacing: 0;
      transition: background 0.15s, color 0.15s;
      border: none;
    }
    .toggle-group label:not(:last-child) { border-right: 1px solid #374151; }
    .toggle-group input[type="radio"]:checked + label { background: #1d4ed8; color: #fff; }
    .divider { border: none; border-top: 1px solid #1f2937; margin: 20px 0; }
    .section-title {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 12px;
    }
    button#berekenBtn {
      margin-top: 20px;
      padding: 11px 28px;
      border-radius: 999px;
      border: none;
      background: #3b82f6;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    button#berekenBtn:hover:not(:disabled) { background: #2563eb; }
    button#berekenBtn:disabled { opacity: 0.45; cursor: default; }
    .loader {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ffffff55;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Results container */
    .results-container {
      display: none;
      margin-top: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .results-header {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    /* Individual train result card */
    .train-card {
      padding: 16px;
      border-radius: 10px;
      background: #030712;
      border: 1px solid #1f2937;
      font-size: 0.9rem;
      position: relative;
    }
    .train-card.option-1 { border-left: 3px solid #60a5fa; }
    .train-card.option-2 { border-left: 3px solid #818cf8; }

    .train-card-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
      color: #6b7280;
    }
    .train-card.option-1 .train-card-tag { color: #60a5fa; }
    .train-card.option-2 .train-card-tag { color: #818cf8; }

    .result-highlight {
      font-size: 2rem;
      font-weight: 800;
      color: #60a5fa;
      margin-bottom: 2px;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .train-card.option-2 .result-highlight { color: #818cf8; }
    .result-sub { font-size: 0.82rem; color: #4b5563; margin-bottom: 14px; }

    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .result-block {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #1f2937;
    }
    .result-block-label {
      font-size: 0.72rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .result-block-value { font-size: 0.92rem; font-weight: 600; color: #e5e7eb; }
    .result-block-sub { font-size: 0.78rem; color: #4b5563; margin-top: 2px; }
    .warn-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #451a03; border: 1px solid #92400e; color: #fcd34d;
      border-radius: 6px; padding: 6px 10px;
      font-size: 0.8rem; font-weight: 600; margin-top: 12px;
    }
    .ok-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: #052e16; border: 1px solid #166534; color: #4ade80;
      border-radius: 6px; padding: 6px 10px;
      font-size: 0.8rem; font-weight: 600; margin-top: 12px;
    }
    .error {
      margin-top: 12px; color: #fca5a5; font-size: 0.85rem;
      background: #1f0a0a; border: 1px solid #450a0a;
      border-radius: 8px; padding: 10px 14px;
    }
    @media (max-width: 520px) { .result-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <h1>Automated Vertrek Calculator</h1>
    <p class="subtitle">Bereken je vertrektijd van thuis op basis van je eerste les en realtime NMBS-data.</p>

    <div class="card">
      <div class="section-title">Lesgegevens</div>
      <div class="grid">
        <div>
          <label for="lesDatum">Lesdatum</label>
          <input type="date" id="lesDatum" required />
        </div>
        <div>
          <label for="lesStart">Starttijd eerste les</label>
          <input type="time" id="lesStart" required />
        </div>
        <div>
          <label for="campusSelect">Campus</label>
          <select id="campusSelect" required>
            <option value="">Kies campus...</option>
            <option value="Carolus">Carolus</option>
            <option value="Opera">Opera</option>
            <option value="Sint-Jacob">Sint-Jacob</option>
          </select>
        </div>
      </div>

      <hr class="divider" />

      <div class="section-title">Vervoer</div>
      <div class="grid">
        <div>
          <label>Thuis → Station</label>
          <div class="toggle-group">
            <input type="radio" name="thuisStationMode" id="mFiets" value="fiets" checked />
            <label for="mFiets">🚲 Fiets (30 min)</label>
            <input type="radio" name="thuisStationMode" id="mAuto" value="auto" />
            <label for="mAuto">🚗 Auto (25 min)</label>
          </div>
        </div>
        <div>
          <label>Station → Campus</label>
          <div class="toggle-group">
            <input type="radio" name="stationCampusMode" id="cStappen" value="stappen" checked />
            <label for="cStappen">🚶 Stappen</label>
            <input type="radio" name="stationCampusMode" id="cFiets" value="fiets" />
            <label for="cFiets">🚲 Fiets</label>
          </div>
        </div>
        <div>
          <label for="thuisStation">Thuisstation (NMBS)</label>
          <input type="text" id="thuisStation" value="Sint-Katelijne-Waver" required />
          <div class="hint">Exacte naam zoals iRail (bv. Antwerpen-Centraal)</div>
        </div>
      </div>

      <button type="button" id="berekenBtn">Bereken vertrektijd</button>
      <div id="error" class="error" style="display:none;"></div>

      <div id="resultsContainer" class="results-container">
        <!-- Cards worden dynamisch ingevuld -->
      </div>
    </div>
  </div>

  <script>
    const campusConfig = {
      "Carolus":    { stappenMin: 23, fietsMin: 8,  station: "Antwerpen-Centraal" },
      "Opera":      { stappenMin: 13, fietsMin: 6,  station: "Antwerpen-Centraal" },
      "Sint-Jacob": { stappenMin: 13, fietsMin: 6,  station: "Antwerpen-Centraal" }
    };

    const THUIS_STATION_MIN = { fiets: 30, auto: 25 };
    const MARGE_MIN = 10;

    function formatTime(epochMs) {
      return new Date(epochMs).toLocaleTimeString("nl-BE", { hour: "2-digit", minute: "2-digit" });
    }

    function toIRailDate(dateStr) {
      const [y, m, d] = dateStr.split("-");
      return `${d}${m}${y.slice(2)}`;
    }

    function toIRailTime(hhmm) {
      return hhmm.replace(":", "");
    }

    async function fetchBestConnections(fromStation, toStation, dateStr, latestArrivalMs) {
      const iRailDate = toIRailDate(dateStr);
      const arrivalTime = new Date(latestArrivalMs);
      const hhmm = arrivalTime.toTimeString().slice(0, 5);
      const iRailTime = toIRailTime(hhmm);

      const url = `https://api.irail.be/v1/connections/?` +
        `from=${encodeURIComponent(fromStation)}` +
        `&to=${encodeURIComponent(toStation)}` +
        `&date=${iRailDate}` +
        `&time=${iRailTime}` +
        `&timesel=arrival` +
        `&results=6` +
        `&format=json&lang=nl`;

      const res = await fetch(url);
      if (!res.ok) throw new Error(`iRail fout (HTTP ${res.status})`);
      const data = await res.json();

      if (!data.connection || data.connection.length === 0) {
        throw new Error("Geen verbindingen gevonden voor deze datum/tijd.");
      }

      // Keep only trains arriving on time (arrival <= latestArrivalMs)
      const valid = data.connection.filter(c =>
        parseInt(c.arrival.time, 10) * 1000 <= latestArrivalMs
      );

      if (valid.length === 0) {
        // No valid options: return earliest available as fallback (not on time)
        return [{ connection: data.connection[0], onTime: false }];
      }

      // Return the last 2 valid trains (latest-departing on top)
      const last2 = valid.slice(-2).reverse();
      return last2.map(c => ({ connection: c, onTime: true }));
    }

    function buildTrainCard(conn, onTime, thuisStationMin, thuisStationMode, latestArrivalMs, index) {
      const dep      = conn.departure;
      const arr      = conn.arrival;
      const depEpoch = parseInt(dep.time, 10) * 1000;
      const arrEpoch = parseInt(arr.time, 10) * 1000;

      const vertrekThuisMs = depEpoch - (thuisStationMin + MARGE_MIN) * 60_000;

      const vehicle   = dep.vehicle || "";
      const trainName = vehicle.startsWith("BE.NMBS.") ? vehicle.replace("BE.NMBS.", "") : vehicle || "Trein";

      let badgeHtml = "";
      if (onTime) {
        const bufferMin = Math.round((latestArrivalMs - arrEpoch) / 60_000);
        badgeHtml = `<span class="ok-badge">✅ Op tijd — ${bufferMin} min speling voor de les</span>`;
      } else {
        badgeHtml = `<span class="warn-badge">⚠️ Geen trein op tijd — vroegst beschikbare optie</span>`;
      }

      const labels = ["Laatste trein", "Op één na laatste"];
      const tagLabel = labels[index] ?? `Optie ${index + 1}`;
      const optionClass = index === 0 ? "option-1" : "option-2";

      return `
        <div class="train-card ${optionClass}">
          <div class="train-card-tag">${tagLabel}</div>
          <div class="result-highlight">${formatTime(vertrekThuisMs)}</div>
          <div class="result-sub">${thuisStationMode === "fiets" ? "🚲 30 min" : "🚗 25 min"} naar station + 10 min veiligheidsmarge</div>
          <div class="result-grid">
            <div class="result-block">
              <div class="result-block-label">🚉 Trein</div>
              <div class="result-block-value">${trainName}</div>
              <div class="result-block-sub">${dep.station} → ${arr.station}</div>
            </div>
            <div class="result-block">
              <div class="result-block-label">⏱ Tijden</div>
              <div class="result-block-value">Vertrekt ${formatTime(depEpoch)}</div>
              <div class="result-block-sub">Aankomst ${formatTime(arrEpoch)} aan ${arr.station}</div>
            </div>
          </div>
          ${badgeHtml}
        </div>
      `;
    }

    document.getElementById("berekenBtn").addEventListener("click", async () => {
      const errorEl     = document.getElementById("error");
      const resultsEl   = document.getElementById("resultsContainer");
      const btn         = document.getElementById("berekenBtn");

      errorEl.style.display   = "none";
      resultsEl.style.display = "none";
      resultsEl.innerHTML     = "";

      const lesDatum          = document.getElementById("lesDatum").value;
      const lesStart          = document.getElementById("lesStart").value;
      const thuisStation      = document.getElementById("thuisStation").value.trim();
      const campus            = document.getElementById("campusSelect").value;
      const stationCampusMode = document.querySelector("input[name='stationCampusMode']:checked").value;
      const thuisStationMode  = document.querySelector("input[name='thuisStationMode']:checked").value;

      if (!lesDatum || !lesStart || !thuisStation || !campus) {
        errorEl.textContent   = "Vul alle velden in.";
        errorEl.style.display = "block";
        return;
      }

      const campusData = campusConfig[campus];
      const [ly, lm, ld] = lesDatum.split("-").map(Number);
      const [lh, lmin]   = lesStart.split(":").map(Number);
      const lesStartMs   = new Date(ly, lm - 1, ld, lh, lmin, 0, 0).getTime();

      const stationCampusMin = stationCampusMode === "stappen" ? campusData.stappenMin : campusData.fietsMin;
      const latestArrivalMs  = lesStartMs - stationCampusMin * 60_000;
      const thuisStationMin  = THUIS_STATION_MIN[thuisStationMode];

      btn.disabled  = true;
      btn.innerHTML = `Bezig… <span class="loader"></span>`;

      try {
        const results = await fetchBestConnections(
          thuisStation,
          campusData.station,
          lesDatum,
          latestArrivalMs
        );

        let html = `<div class="results-header">Vertrektijd van thuis</div>`;
        results.forEach(({ connection, onTime }, i) => {
          html += buildTrainCard(connection, onTime, thuisStationMin, thuisStationMode, latestArrivalMs, i);
        });

        resultsEl.innerHTML     = html;
        resultsEl.style.display = "flex";
      } catch (err) {
        console.error(err);
        errorEl.textContent   = "Fout bij ophalen NMBS-data: " + err.message;
        errorEl.style.display = "block";
      } finally {
        btn.disabled  = false;
        btn.innerHTML = "Bereken vertrektijd";
      }
    });

    // Vandaag als standaard datum
    const today = new Date();
    const yyyy  = today.getFullYear();
    const mm    = String(today.getMonth() + 1).padStart(2, "0");
    const dd    = String(today.getDate()).padStart(2, "0");
    document.getElementById("lesDatum").value = `${yyyy}-${mm}-${dd}`;
  </script>
</body>
</html>
